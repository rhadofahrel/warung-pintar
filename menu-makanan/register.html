<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Warung Pintar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .auth-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 3rem;
        }

        .auth-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .auth-subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FF6B35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row .form-group {
            margin-bottom: 1rem;
        }

        .password-strength {
            margin-top: 0.5rem;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-weak { background: #f44336; }
        .strength-fair { background: #ff9800; }
        .strength-good { background: #ffc107; }
        .strength-strong { background: #4CAF50; }

        .strength-text {
            font-size: 0.8rem;
            margin-top: 0.3rem;
            color: #999;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 0.3rem;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #FF6B35;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .form-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-register {
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            color: white;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #999;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            display: inline-block;
            width: 40%;
            height: 1px;
            background: #ddd;
            vertical-align: middle;
        }

        .divider::before {
            margin-right: 0.5rem;
        }

        .divider::after {
            margin-left: 0.5rem;
        }

        .login-section {
            text-align: center;
            color: #666;
        }

        .login-section a {
            color: #FF6B35;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-section a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .loading {
            display: none;
            text-align: center;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #FF6B35;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 1.5rem;
            }

            .auth-title {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- LOGO -->
        <div class="auth-logo">🍽️</div>

        <!-- TITLE -->
        <h1 class="auth-title">Daftar Akun</h1>
        <p class="auth-subtitle">Bergabunglah dengan Warung Pintar</p>

        <!-- ALERT -->
        <div id="alertBox" class="alert"></div>

        <!-- REGISTER FORM -->
        <form id="registerForm">
            <!-- Name & Email -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fullname">Nama Lengkap</label>
                    <input 
                        type="text" 
                        id="fullname" 
                        placeholder="John Doe"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="john@example.com"
                        required
                    >
                </div>
            </div>

            <!-- Username & Phone -->
            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="johndoe"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="phone">Nomor HP</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        placeholder="+62812345678"
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Minimal 6 karakter"
                    required
                >
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    placeholder="Ulangi password"
                    required
                >
            </div>

            <!-- Role Selection -->
            <div class="form-group">
                <label for="role">Daftar Sebagai</label>
                <select id="role" required>
                    <option value="">-- Pilih Role --</option>
                    <option value="customer">Customer (Pembeli)</option>
                    <option value="admin">Admin (Pemilik)</option>
                </select>
            </div>

            <!-- Terms -->
            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    Saya setuju dengan <a href="#">Syarat & Ketentuan</a> dan <a href="#">Kebijakan Privasi</a>
                </label>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-register" id="registerBtn">Daftar Akun</button>
            </div>

            <div class="loading" id="loadingBox">
                <div class="spinner"></div>
            </div>
        </form>

        <!-- DIVIDER -->
        <div class="divider">atau</div>

        <!-- LOGIN SECTION -->
        <div class="login-section">
            <p>Sudah punya akun? <a href="./login.html">Login di sini</a></p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // Check if user is already logged in
        window.addEventListener('load', () => {
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                const user = JSON.parse(currentUser);
                if (user.role === 'admin') {
                    window.location.href = './admin.html';
                } else {
                    window.location.href = './index.html';
                }
            }
        });

        // Password strength checker
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            let text = '';

            if (password.length >= 6) strength += 25;
            if (password.length >= 8) strength += 25;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 12.5;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 12.5;

            if (password.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = '';
                strengthBar.className = 'password-strength-bar';
            } else if (strength < 25) {
                strengthBar.style.width = '25%';
                strengthBar.className = 'password-strength-bar strength-weak';
                strengthText.textContent = 'Sangat lemah';
            } else if (strength < 50) {
                strengthBar.style.width = '50%';
                strengthBar.className = 'password-strength-bar strength-fair';
                strengthText.textContent = 'Lemah';
            } else if (strength < 75) {
                strengthBar.style.width = '75%';
                strengthBar.className = 'password-strength-bar strength-good';
                strengthText.textContent = 'Sedang';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.className = 'password-strength-bar strength-strong';
                strengthText.textContent = 'Kuat';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleRegister();
        });

        async function handleRegister() {
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const terms = document.getElementById('terms').checked;
            const alertBox = document.getElementById('alertBox');
            const registerBtn = document.getElementById('registerBtn');
            const loadingBox = document.getElementById('loadingBox');

            // Validation
            if (!fullname || !email || !username || !password || !role) {
                showAlert('Semua field harus diisi', 'danger', alertBox);
                return;
            }

            if (password.length < 6) {
                showAlert('Password minimal 6 karakter', 'danger', alertBox);
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Password tidak cocok', 'danger', alertBox);
                return;
            }

            if (!terms) {
                showAlert('Anda harus setuju dengan Syarat & Ketentuan', 'danger', alertBox);
                return;
            }

            // Check if username exists
            const users = getRegisteredUsers();
            if (users.find(u => u.username === username)) {
                showAlert('Username sudah terdaftar', 'danger', alertBox);
                return;
            }

            if (users.find(u => u.email === email)) {
                showAlert('Email sudah terdaftar', 'danger', alertBox);
                return;
            }

            // Show loading
            registerBtn.style.display = 'none';
            loadingBox.style.display = 'block';

            try {
                // Simulate delay
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Create new user
                const newUser = {
                    id: Date.now(),
                    fullname,
                    email,
                    username,
                    phone,
                    password, // Note: In production, hash this!
                    role,
                    createdAt: new Date().toISOString()
                };

                // Save to localStorage
                users.push(newUser);
                localStorage.setItem('registeredUsers', JSON.stringify(users));

                showAlert('✓ Akun berhasil dibuat! Redirecting ke login...', 'success', alertBox);

                // Redirect to login
                setTimeout(() => {
                    window.location.href = './login.html';
                }, 2000);
            } catch (error) {
                console.error('Register error:', error);
                showAlert('Terjadi kesalahan. Silahkan coba lagi.', 'danger', alertBox);
                registerBtn.style.display = 'block';
                loadingBox.style.display = 'none';
            }
        }

        function showAlert(message, type, container) {
            container.textContent = message;
            container.className = `alert show alert-${type}`;
            setTimeout(() => {
                container.classList.remove('show');
            }, 4000);
        }

        // Get registered users from localStorage
        function getRegisteredUsers() {
            const stored = localStorage.getItem('registeredUsers');
            return stored ? JSON.parse(stored) : getDefaultUsers();
        }

        // Initialize default users
        function getDefaultUsers() {
            return [
                {
                    id: 1,
                    fullname: 'Admin User',
                    email: 'admin@warungpintar.com',
                    username: 'admin',
                    phone: '+6281234567890',
                    password: 'admin123',
                    role: 'admin',
                    createdAt: '2024-01-01T00:00:00Z'
                },
                {
                    id: 2,
                    fullname: 'Customer User',
                    email: 'customer@example.com',
                    username: 'customer',
                    phone: '+6281234567890',
                    password: 'customer123',
                    role: 'customer',
                    createdAt: '2024-01-01T00:00:00Z'
                }
            ];
        }

        // Initialize if no users exist
        if (!localStorage.getItem('registeredUsers')) {
            localStorage.setItem('registeredUsers', JSON.stringify(getDefaultUsers()));
        }
    </script>
</body>
</html>
